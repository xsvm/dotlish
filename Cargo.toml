[package]
name = "dotlish"
version = "0.1.0"
edition = "2024"
description = "给英语学习者的划词助手：选中文本，按快捷键翻译、查词、发音或纠错"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/xsvm/dotlish"

[dependencies]
arboard = "3.7.0"
dirs = "7.0.0"
display-info = "0.5.10"
enigo = "0.6.1"
inputs = { version = "0.1.1", default-features = false, features = ["serde"] }
# 只要播放和 MP3 解码（单词发音）
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
single-instance = "0.3.3"
# 只用软件渲染器：默认的 femtovg 走 OpenGL，一启动就加载显卡驱动，空闲常驻约 45MB；
# 软件渲染空闲约 4MB，画这么小的弹窗也足够快
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "system-tray",
    # 直接给 winit 窗口设图标、不进任务栏（见 tray::apply_window_icon）
    "unstable-winit-030",
] }
toml = "1.1.8"
tray-icon = "0.26.1"
ureq = "3.5.0"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
# 去掉调试符号，减小体积
strip = true
lto = "thin"
