[package]
name = "select-assist"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
dirs = "7.0.0"
display-info = "0.5.10"
enigo = "0.6.1"
inputs = { version = "0.1.1", default-features = false, features = ["serde"] }
# 只要播放和 MP3 解码（单词发音）
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
single-instance = "0.3.3"
slint = "1.18.1"
toml = "1.1.8"
tray-icon = "0.26.1"
ureq = "3.5.0"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
# 去掉调试符号，减小体积
strip = true
lto = "thin"
